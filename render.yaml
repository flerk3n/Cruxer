# Render Blueprint for the long-running Cruxer generation API.
# This service is intentionally rooted at the repository so npm workspaces and
# the shared TypeScript pipeline resolve exactly as they do in local development.
services:
  - type: web
    name: cruxer-api
    runtime: node
    region: singapore
    # Starter (not free): free instances sleep and lose in-flight generations.
    plan: starter
    buildCommand: npm ci --include=dev && npm run typecheck --workspace=@cruxer/api
    startCommand: npm run start --workspace=@cruxer/api
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # Render assigns PORT for web services. Do not declare it here.
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_TTL_DAYS
        value: "7"
      - key: BCRYPT_ROUNDS
        value: "12"
      - key: COOKIE_NAME
        value: cruxer_session
      # Set this to the production Vercel origin (for example,
      # https://cruxer.vercel.app) when creating the Blueprint.
      - key: WEB_ORIGIN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
      - key: GEMINI_MIN_REQUEST_INTERVAL_MS
        value: "500"
      - key: TAVILY_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_AGENT_ID
        sync: false
      - key: DODO_PAYMENTS_API_KEY
        sync: false
      - key: DODO_PAYMENTS_WEBHOOK_KEY
        sync: false
      - key: DODO_PAYMENTS_ENVIRONMENT
        value: live_mode
      - key: DODO_PRO_PRODUCT_ID
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: TURNSTILE_SECRET_KEY
        sync: false
